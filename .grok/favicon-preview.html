<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #888; }
  .row { display: flex; gap: 24px; align-items: end; padding: 16px; background: #d0d0d0; }
  .dark { background: #222; }
  img { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
  <div class="row">
    <img src="file:///workspace/public/favicon.svg" width="16" height="16" />
    <img src="file:///workspace/public/favicon.svg" width="32" height="32" />
    <img src="file:///workspace/public/favicon.svg" width="64" height="64" />
    <img src="file:///workspace/public/favicon.svg" width="180" height="180" />
  </div>
  <div class="row dark">
    <img src="file:///workspace/public/favicon.svg" width="16" height="16" />
    <img src="file:///workspace/public/favicon.svg" width="32" height="32" />
    <img src="file:///workspace/public/favicon.svg" width="64" height="64" />
  </div>
</body>
</html>
